<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title id="page-title">Cargando noticia... - Cafeteando La Noticia</title>
  <style>
    :root {
      --primary: #8b1e0f;
      --accent: #d97706;
      --bg-light: #fdfbf7;
      --text-dark: #292524;
      --text-muted: #78716c;
      --border-color: #e7e5e4;
      --card-bg: #ffffff;
    }

    * { box-sizing: border-box; margin: 0; padding: 0; }
    body { font-family: 'Segoe UI', system-ui, sans-serif; background: var(--bg-light); color: var(--text-dark); line-height: 1.7; }
    header { background: var(--primary); color: white; padding: 1.5rem 1rem; text-align: center; }
    nav { background: white; border-bottom: 1px solid var(--border-color); padding: 0.75rem 1rem; }
    .container { max-width: 800px; margin: 0 auto; padding: 0 1rem; }
    nav a { color: var(--primary); text-decoration: none; font-weight: 600; font-size: 0.9rem; }
    main { margin: 2rem auto; }
    article { background: var(--card-bg); border-radius: 12px; padding: 2rem; border: 1px solid var(--border-color); box-shadow: 0 2px 8px rgba(0,0,0,0.05); }
    .meta-badge { display: inline-block; background: #fef3c7; color: #92400e; font-weight: 700; font-size: 0.8rem; padding: 0.25rem 0.75rem; border-radius: 50px; text-transform: uppercase; margin-bottom: 1rem; }
    .article-title { font-size: 2rem; color: #1c1917; margin-bottom: 1rem; line-height: 1.3; }
    .article-meta { display: flex; flex-wrap: wrap; gap: 1.5rem; font-size: 0.9rem; color: var(--text-muted); border-bottom: 1px solid var(--border-color); padding-bottom: 1rem; margin-bottom: 1.5rem; }
    .featured-image-container { margin: 1.5rem 0 2rem; border-radius: 10px; overflow: hidden; background: #f3f4f6; text-align: center; }
    .featured-image-container img { width: 100%; height: auto; max-height: 550px; object-fit: cover; display: block; }
    .image-caption { font-size: 0.85rem; color: var(--text-muted); padding: 0.6rem 1rem; background: #f8fafc; font-style: italic; border-top: 1px solid #e2e8f0; }
    .content-body { font-size: 1.05rem; color: #334155; }
    .content-body p { margin-bottom: 1.25rem; }
    .recommendation-box { background: #fffbeb; border-left: 4px solid var(--accent); padding: 1.25rem; border-radius: 0 8px 8px 0; margin: 1.5rem 0; }
    .recommendation-box h3 { color: #b45309; font-size: 1.1rem; margin-bottom: 0.5rem; }
    .recommendation-box ul { list-style: none; padding: 0; }
    .recommendation-box li { margin-bottom: 0.4rem; padding-left: 1.5rem; position: relative; }
    .recommendation-box li::before { content: "📌"; position: absolute; left: 0; }
    footer { text-align: center; padding: 2rem 1rem; color: var(--text-muted); font-size: 0.85rem; border-top: 1px solid var(--border-color); margin-top: 3rem; }
  </style>
</head>
<body>

  <header>
    <h1>Cafeteando La Noticia</h1>
    <p>Portal Informativo &amp; Recomendaciones Gastronómicas</p>
  </header>

  <nav>
    <div class="container">
      <a href="index.html">&larr; Volver al Inicio</a>
    </div>
  </nav>

  <main class="container">
    <article id="news-article">
      <p>Cargando contenido...</p>
    </article>
  </main>

  <footer>
    <p>&copy; 2026 Cafeteando La Noticia. Todos los derechos reservados.</p>
  </footer>

  <script>
    async function loadArticle() {
      const urlParams = new URLSearchParams(window.location.search);
      const noteId = parseInt(urlParams.get('id')) || 5;

      try {
        const response = await fetch('data/noticias.json');
        const news = await response.json();
        const article = news.find(n => n.id === noteId);

        if (!article) {
          document.getElementById('news-article').innerHTML = '<h2>Noticia no encontrada</h2>';
          return;
        }

        document.title = `${article.title} - Cafeteando La Noticia`;

        let recsHtml = '';
        if (article.recommendations && article.recommendations.length > 0) {
          recsHtml = `
            <div class="recommendation-box">
              <h3>Recomendaciones del Día:</h3>
              <ul>
                ${article.recommendations.map(r => `<li>${r}</li>`).join('')}
              </ul>
            </div>
          `;
        }

        document.getElementById('news-article').innerHTML = `
          <span class="meta-badge">${article.tag}</span>
          <h1 class="article-title">${article.title}</h1>
          <div class="article-meta">
            <span>📅 <strong>Fecha:</strong> ${article.date}</span>
            <span>✍️ <strong>Por:</strong> ${article.author}</span>
            <span>📍 <strong>Lugar:</strong> ${article.location}</span>
          </div>
          <div class="featured-image-container">
            <img src="${article.image}" alt="${article.title}">
            <div class="image-caption">${article.caption}</div>
          </div>
          <div class="content-body">
            <p>${article.intro}</p>
            <p>${article.content}</p>
            ${recsHtml}
          </div>
        `;
      } catch (error) {
        console.error('Error al cargar la noticia:', error);
      }
    }

    loadArticle();
  </script>
</body>
</html>
