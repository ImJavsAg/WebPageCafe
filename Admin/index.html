<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Panel de Administración - Cafeteando La Noticia</title>
  <!-- Widget oficial de Netlify Identity -->
  <script src="https://identity.netlify.com/v1/netlify-identity-widget.js"></script>
</head>
<body>
  <!-- Script de Decap CMS -->
  <script src="https://unpkg.com/decap-cms@^3.0.0/dist/decap-cms.js"></script>

<script>
  // Configuración de tu repositorio en GitHub
  const GITHUB_USER = 'ImJavsAg';
  const GITHUB_REPO = 'WebPageCafe';

  async function cargarNoticiasCMS() {
    const newsContainer = document.getElementById('news-grid');

    try {
      // 1. Consultar la API de GitHub para obtener los archivos en content/noticias
      const response = await fetch(`https://api.github.com/repos/${GITHUB_USER}/${GITHUB_REPO}/contents/content/noticias`);
      
      if (!response.ok) {
        throw new Error('Aún no hay publicaciones creadas desde el panel admin.');
      }

      const files = await response.json();
      newsContainer.innerHTML = ''; // Limpiar mensaje de carga

      // 2. Recorrer cada archivo Markdown (.md)
      for (const file of files) {
        if (file.name.endsWith('.md')) {
          // Descargar el contenido crudo del archivo
          const rawResponse = await fetch(file.download_url);
          const rawText = await rawResponse.text();

          // Extraer los metadatos (Frontmatter YAML) entre --- y ---
          const meta = parseFrontmatter(rawText);

          // Crear la tarjeta de noticia con la misma clase que usamos en el CSS
          const article = document.createElement('article');
          article.className = 'news-card';

          article.innerHTML = `
            <span class="tag opinion">${meta.tag || 'OPINIÓN'}</span>
            <h3>${meta.title || 'Sin título'}</h3>
            <p>${meta.subtitle || 'Haz clic para leer el contenido completo de esta noticia.'}</p>
            <a href="nota.html?file=${file.name}">Leer artículo y comentar →</a>
          `;

          newsContainer.appendChild(article);
        }
      }

    } catch (error) {
      console.log(error);
      newsContainer.innerHTML = `<p class="error-msg">Aún no hay publicaciones en el panel de administración.</p>`;
    }
  }

  // Función interna para parsear el encabezado YAML del Markdown
  function parseFrontmatter(text) {
    const meta = {};
    const match = text.match(/^---\r?\n([\s\S]*?)\r?\n---/);
    
    if (match) {
      const lines = match[1].split('\n');
      lines.forEach(line => {
        const [key, ...val] = line.split(':');
        if (key && val.length) {
          let value = val.join(':').trim();
          // Limpiar comillas si existen
          value = value.replace(/^["']|["']$/g, '');
          meta[key.trim()] = value;
        }
      });
    }
    return meta;
  }

  // Ejecutar la carga de noticias al abrir la página
  document.addEventListener('DOMContentLoaded', cargarNoticiasCMS);
</script>


</body>
</html>
